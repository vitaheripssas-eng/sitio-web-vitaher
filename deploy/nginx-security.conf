# VITAHER IPS — bloqueo de archivos sensibles en nginx
#
# CloudPanel usa nginx, por lo que public/storage/.htaccess NO se aplica.
# Sin este bloqueo, /storage/submissions.log, /storage/submissions.csv,
# /storage/smtp_pass.txt, /storage/admin_pass.txt y /storage/admin_hash.txt
# pueden descargarse directamente desde Internet.
#
# En CloudPanel: Sites > vitaherips.com > Vhost.
# Pega estas reglas antes del bloque "location /" y guarda.
# Luego verifica con:
#   curl -I https://vitaherips.com/storage/submissions.log
# Debe responder 403.

location ^~ /storage/ {
    deny all;
    return 403;
}

location = /storage {
    return 403;
}

# Bloquea archivos ocultos (.env, .git, .htaccess, etc.),
# dejando pasar .well-known para la validación de Let's Encrypt.
location ~ /\.(?!well-known) {
    deny all;
    return 403;
}
